<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wallet" />
  <meta name="theme-color" content="#000000" />
  <title>Apple Pay</title>
  <style>
    :root {
      --bg: #000000;
      --ios-blue: #0A84FF;
      --ios-blue-glow: rgba(10, 132, 255, 0.32);
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .wallet-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 44px) + 22px) 18px calc(env(safe-area-inset-bottom, 34px) + 56px);
    }

    /* === КАРТА === */
    .card-stage {
      width: 100%;
      max-width: 392px;
      perspective: 1200px;
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 1.586 / 1;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffffff 0%, #f5f6f8 52%, #e6e9ef 100%);
      overflow: hidden;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.72),
        0 4px 14px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.6);
      transform: translateY(18px) scale(0.96);
      opacity: 0;
      animation: cardEnter 0.65s var(--ease-spring) forwards;
      transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-spring);
    }

    .card.paid {
      transform: translateY(-2px) scale(1.012);
      box-shadow:
        0 28px 60px rgba(10, 132, 255, 0.14),
        0 8px 20px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    @keyframes cardEnter {
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Водяной паттерн на фоне карты */
    .card-watermark {
      position: absolute;
      inset: -25%;
      pointer-events: none;
      opacity: 0.045;
      font-size: 92px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      color: #0f172a;
      transform: rotate(-22deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      white-space: nowrap;
    }

    /* Блик при успешной оплате */
    .card-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        112deg,
        transparent 20%,
        rgba(255, 255, 255, 0.78) 48%,
        rgba(255, 255, 255, 0.15) 56%,
        transparent 75%
      );
      transform: translateX(-130%);
      pointer-events: none;
    }

    .card.paid .card-sheen {
      animation: sheenSweep 0.85s var(--ease-spring) forwards;
    }

    @keyframes sheenSweep {
      to { transform: translateX(130%); }
    }

    .card-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-issuer-mark {
      width: 30px;
      height: 22px;
      opacity: 0.35;
    }

    .card-contactless {
      width: 18px;
      height: 18px;
      color: #64748b;
      opacity: 0.45;
    }

    .card-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .card-digits {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-dots {
      letter-spacing: 2px;
      font-size: 14px;
      opacity: 0.85;
    }

    .card-brand {
      text-align: right;
      line-height: 1;
    }

    .visa-word {
      font-size: 27px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.04em;
      color: #1434CB;
      display: block;
    }

    .visa-tier {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #475569;
      margin-top: 2px;
      display: block;
    }

    /* === ЗОНА СТАТУСА (ЦЕНТР-НИЗ) === */
    .status-zone {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
    }

    .glyph-stage {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .state-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.84);
      transition: opacity 0.32s var(--ease-spring), transform 0.38s var(--ease-spring);
      pointer-events: none;
    }

    .state-layer.active {
      opacity: 1;
      transform: scale(1);
    }

    /* 1. Face ID */
    .faceid-box {
      position: relative;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .faceid-svg {
      width: 52px;
      height: 52px;
      color: var(--ios-blue);
      filter: drop-shadow(0 0 14px rgba(10, 132, 255, 0.35));
      animation: facePulse 1.1s ease-in-out infinite;
    }

    @keyframes facePulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    /* 2. Поднесите к считывателю (NFC) */
    .nfc-ripple {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1.5px solid rgba(10, 132, 255, 0.45);
      opacity: 0;
    }

    .state-layer.active .nfc-ripple {
      animation: rippleOut 1.8s var(--ease-spring) infinite;
    }

    .state-layer.active .nfc-ripple.delay {
      animation-delay: 0.9s;
    }

    @keyframes rippleOut {
      0% { transform: scale(0.75); opacity: 0.7; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    .nfc-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(10, 132, 255, 0.12);
      border: 1.5px solid rgba(10, 132, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .nfc-waves path {
      stroke: var(--ios-blue);
      stroke-width: 2.4;
      stroke-linecap: round;
      fill: none;
      opacity: 0.35;
    }

    .state-layer.active .nfc-waves path:nth-child(1) { animation: waveLit 1.2s ease-in-out infinite 0.0s; }
    .state-layer.active .nfc-waves path:nth-child(2) { animation: waveLit 1.2s ease-in-out infinite 0.18s; }
    .state-layer.active .nfc-waves path:nth-child(3) { animation: waveLit 1.2s ease-in-out infinite 0.36s; }

    @keyframes waveLit {
      0%, 100% { opacity: 0.3; }
      45% { opacity: 1; }
    }

    /* 3. Синяя галочка Apple Pay */
    .done-glow {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--ios-blue-glow) 0%, transparent 72%);
      opacity: 0;
      transform: scale(0.6);
    }

    .state-layer.active .done-glow {
      animation: glowBloom 0.9s var(--ease-spring) forwards;
    }

    @keyframes glowBloom {
      0% { opacity: 0; transform: scale(0.6); }
      40% { opacity: 1; transform: scale(1.6); }
      100% { opacity: 0.35; transform: scale(1.25); }
    }

    .done-svg {
      width: 72px;
      height: 72px;
      overflow: visible;
    }

    .done-ring {
      fill: none;
      stroke: var(--ios-blue);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-dasharray: 202;
      stroke-dashoffset: 202;
      transform-origin: 36px 36px;
      transform: rotate(-90deg);
    }

    .done-check {
      fill: none;
      stroke: var(--ios-blue);
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
    }

    .state-layer.active .done-ring {
      animation: drawRing 0.42s var(--ease-spring) forwards;
    }

    .state-layer.active .done-check {
      animation: drawCheck 0.34s var(--ease-bounce) 0.16s forwards;
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Текст под иконкой */
    .status-label {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--text-secondary);
      min-height: 22px;
      transition: color 0.3s ease, opacity 0.22s ease, transform 0.28s var(--ease-spring);
    }

    .status-label.done {
      color: var(--text-primary);
      font-weight: 500;
    }

    .status-label.switching {
      opacity: 0;
      transform: translateY(4px);
    }

    /* Нижний индикатор (подсказка для перезапуска, почти невидима) */
    .footer-hint {
      font-size: 12px;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.22);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .footer-hint.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="wallet-shell" id="app">
    <!-- КАРТА -->
    <section class="card-stage">
      <div class="card" id="card">
        <div class="card-watermark" aria-hidden="true">
          <span>PLATINUM</span>
          <span>&nbsp;&nbsp;PLATINUM</span>
        </div>
        <div class="card-sheen" aria-hidden="true"></div>

        <div class="card-top">
          <!-- Минималистичная эмблема -->
          <svg class="card-issuer-mark" viewBox="0 0 32 22" fill="currentColor">
            <circle cx="11" cy="11" r="8" fill="#1e293b" />
            <circle cx="20" cy="11" r="8" fill="#64748b" />
          </svg>
          <!-- Значок бесконтактной оплаты -->
          <svg class="card-contactless" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M8.5 16.5a6.5 6.5 0 0 0 0-9" />
            <path d="M12.5 19a10.5 10.5 0 0 0 0-14" />
            <path d="M16.5 21.5a14.5 14.5 0 0 0 0-19" />
          </svg>
        </div>

        <div class="card-bottom">
          <div class="card-digits">
            <span class="card-dots">••••</span>
            <span id="cardLast4">5104</span>
          </div>
          <div class="card-brand">
            <span class="visa-word">VISA</span>
            <span class="visa-tier">Platinum</span>
          </div>
        </div>
      </div>
    </section>

    <!-- АНИМАЦИЯ СТАТУСОВ -->
    <section class="status-zone" aria-live="polite">
      <div class="glyph-stage">
        <!-- Фаза 1: Face ID -->
        <div class="state-layer" id="layerFaceId">
          <div class="faceid-box">
            <svg class="faceid-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 6H9a3 3 0 0 0-3 3v5" />
              <path d="M34 6h5a3 3 0 0 1 3 3v5" />
              <path d="M14 42H9a3 3 0 0 1-3-3v-5" />
              <path d="M34 42h5a3 3 0 0 0 3-3v-5" />
              <path d="M17 18v3" />
              <path d="M31 18v3" />
              <path d="M24 18v7a2 2 0 0 1-2 2h-1" />
              <path d="M17 31.5c2 2.2 4.5 3.3 7 3.3s5-1.1 7-3.3" />
            </svg>
          </div>
        </div>

        <!-- Фаза 2: Поднесите к считывателю -->
        <div class="state-layer" id="layerNfc">
          <div class="nfc-ripple"></div>
          <div class="nfc-ripple delay"></div>
          <div class="nfc-circle">
            <svg class="nfc-waves" width="30" height="30" viewBox="0 0 28 28">
              <path d="M10 18.5a6.5 6.5 0 0 0 0-9" />
              <path d="M14 21a10.5 10.5 0 0 0 0-14" />
              <path d="M18 23.5a14.5 14.5 0 0 0 0-19" />
            </svg>
          </div>
        </div>

        <!-- Фаза 3: Синяя галочка -->
        <div class="state-layer" id="layerDone">
          <div class="done-glow"></div>
          <svg class="done-svg" viewBox="0 0 72 72">
            <circle class="done-ring" cx="36" cy="36" r="32" />
            <path class="done-check" d="M22.5 36.8 L31.8 46.2 L50 26.8" />
          </svg>
        </div>
      </div>

      <div class="status-label" id="statusLabel">Face ID</div>
    </section>

    <div class="footer-hint" id="footerHint">Нажмите на экран, чтобы повторить</div>
  </main>

  <script>
    // === НАСТРОЙКИ ТАЙМИНГОВ (мс) ===
    const FACE_ID_DURATION = 1100;   // Длительность Face ID
    const SUCCESS_TIME = 3500;       // Появление синей галочки ровно через 3.5 сек

    const cardEl = document.getElementById('card');
    const layerFaceId = document.getElementById('layerFaceId');
    const layerNfc = document.getElementById('layerNfc');
    const layerDone = document.getElementById('layerDone');
    const statusLabel = document.getElementById('statusLabel');
    const footerHint = document.getElementById('footerHint');

    let audioCtx = null;
    let timers = [];
    let isDone = false;

    // Инициализация и разблокировка Web Audio на iOS
    function ensureAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    // Синтез чистого двухтонового «дзинь» в стиле Apple Pay
    function playApplePayChime() {
      const ctx = ensureAudio();
      if (!ctx || ctx.state !== 'running') return;

      const now = ctx.currentTime;

      function playBellNote(freq, startTime, duration, volume) {
        const oscMain = ctx.createOscillator();
        const oscHarmonic = ctx.createOscillator();
        const gainMain = ctx.createGain();
        const gainHarmonic = ctx.createGain();

        oscMain.type = 'sine';
        oscMain.frequency.setValueAtTime(freq, startTime);

        // Кристальный обертон (октава выше)
        oscHarmonic.type = 'sine';
        oscHarmonic.frequency.setValueAtTime(freq * 2, startTime);

        gainMain.gain.setValueAtTime(0.0001, startTime);
        gainMain.gain.linearRampToValueAtTime(volume, startTime + 0.008);
        gainMain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        gainHarmonic.gain.setValueAtTime(0.0001, startTime);
        gainHarmonic.gain.linearRampToValueAtTime(volume * 0.22, startTime + 0.006);
        gainHarmonic.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.55);

        oscMain.connect(gainMain);
        oscHarmonic.connect(gainHarmonic);
        gainMain.connect(ctx.destination);
        gainHarmonic.connect(ctx.destination);

        oscMain.start(startTime);
        oscHarmonic.start(startTime);
        oscMain.stop(startTime + duration + 0.05);
        oscHarmonic.stop(startTime + duration + 0.05);
      }

      // Классический интервал чистой кварты (B5 -> E6)
      playBellNote(987.77, now, 0.42, 0.28);
      playBellNote(1318.51, now + 0.105, 0.68, 0.34);
    }

    function setLabel(text, isFinal = false) {
      statusLabel.classList.add('switching');
      setTimeout(() => {
        statusLabel.textContent = text;
        statusLabel.classList.toggle('done', isFinal);
        statusLabel.classList.remove('switching');
      }, 140);
    }

    function setPhase(phase) {
      layerFaceId.classList.toggle('active', phase === 'faceid');
      layerNfc.classList.toggle('active', phase === 'nfc');
      layerDone.classList.toggle('active', phase === 'done');
    }

    function clearAllTimers() {
      timers.forEach(clearTimeout);
      timers = [];
    }

    function runPaymentSequence() {
      clearAllTimers();
      isDone = false;

      cardEl.classList.remove('paid');
      footerHint.classList.remove('visible');

      // Перезапуск SVG-анимации галочки при повторе
      layerDone.classList.remove('active');
      void layerDone.offsetWidth;

      // 0.0s — Face ID
      setPhase('faceid');
      statusLabel.textContent = 'Face ID';
      statusLabel.classList.remove('done', 'switching');

      // 1.1s — Поднесите к считывателю
      timers.push(setTimeout(() => {
        setPhase('nfc');
        setLabel('Поднесите к считывателю');
      }, FACE_ID_DURATION));

      // 3.5s — Синяя галочка + звук + блик на карте
      timers.push(setTimeout(() => {
        isDone = true;
        setPhase('done');
        setLabel('Готово', true);
        cardEl.classList.add('paid');
        playApplePayChime();

        if (navigator.vibrate) {
          navigator.vibrate([15, 40, 25]);
        }

        timers.push(setTimeout(() => {
          footerHint.classList.add('visible');
        }, 1200));
      }, SUCCESS_TIME));
    }

    // Любое касание разблокирует звук на iOS, а после «Готово» перезапускает сцену
    document.getElementById('app').addEventListener('pointerdown', () => {
      ensureAudio();
      if (isDone) {
        runPaymentSequence();
      }
    });

    // Автозапуск при открытии (для Быстрых команд)
    window.addEventListener('load', () => {
      ensureAudio();
      runPaymentSequence();
    });
  </script>
</body>
</html>
